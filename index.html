  <!-- ============================================================
    🟢 CAPTURA DO GCLID E FUNÇÃO PARA ANEXAR À URL
    Captura o parâmetro gclid da URL da presell e guarda em localStorage.
    Ao clicar nos botões, anexa esse gclid como "cid" na URL de destino.
  ============================================================ -->
  <script>
    function getGclid() {
      var params = new URLSearchParams(window.location.search);
      var gclid = params.get('gclid');
      if (gclid) {
        localStorage.setItem('gclid_saved', gclid);
        return gclid;
      }
      return localStorage.getItem('gclid_saved');
    }

    function appendGclidToUrl(url) {
      var gclid = getGclid();
      if (!gclid) return url;

      var hashIndex = url.indexOf('#');
      var baseUrl = hashIndex >= 0 ? url.substring(0, hashIndex) : url;
      var hash = hashIndex >= 0 ? url.substring(hashIndex) : '';

      var separator = baseUrl.indexOf('?') >= 0 ? '&' : '?';
      return baseUrl + separator + 'cid=' + encodeURIComponent(gclid) + hash;
    }
  </script>

      top: 0;
      left: 0;
      width: 100%;

      background: rgba(8, 20, 35, 0);
      z-index: 1;
      animation: darkenIn 0.8s cubic-bezier(0.25, 0.8, 0.35, 1) forwards;
    }

    @keyframes darkenIn {

      100% {

      }

    /* ----- MODAL - ESTILO PERSONALIZADO (cor #5364A8) ----- */

      z-index: 20;
      max-width: 380px;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 20px 20px 18px 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 10px 24px rgba(30, 40, 80, 0.3);

      /* Velocidade MÉDIA (0.8s) */
      animation: slideUpBounce 0.8s cubic-bezier(0.25, 0.8, 0.35, 1) forwards;
      transform-origin: center;
      margin: 12px;
      border: none;
    }

    /* Botão "X" no canto superior direito */
    .modal-close {

      top: 10px;
      right: 12px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: transparent;
      color: #3A4A7A;
      font-size: 1.1rem;
      font-weight: 400;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
      z-index: 30;
      opacity: 0.55;
    }

    .modal-close:hover {
      background: rgba(83, 100, 168, 0.10);
      opacity: 1;
      transform: scale(1.08);
    }

    .modal-close:active {

      font-weight: 700;

    /* ----- ANIMAÇÃO DO MODAL: SLIDE DE BAIXO PARA CIMA COM SETTLE ----- */
