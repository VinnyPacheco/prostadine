<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Cookie Policy · Prostadine</title>

  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
    }

    /* Bloqueia scroll do body enquanto o modal está visível */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a1828;
      padding: 16px;
      margin: 0;
      overflow: hidden;
      height: 100vh;
    }

    /* ----- FUNDO COM IMAGEM (bg.jpg - desktop) ----- */
    .page-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('bg.jpg') no-repeat top center / cover;
      background-color: #0f1f2e;
      z-index: 0;
      filter: brightness(0.85) saturate(1.05);
    }

    /* Mobile: usa bg-m.jpg em vez da versão desktop */
    @media (max-width: 768px) {
      .page-bg {
        background: url('bg-m.jpg') no-repeat top center / cover;
        background-color: #0f1f2e;
      }
    }

    /* Overlay escuro mais sutil */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 20, 35, 0.50);
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      z-index: 1;
    }

    /* ----- MODAL - ESTILO AZUL (predominante na imagem) ----- */
    .cookie-modal {
      position: relative;
      z-index: 20;
      max-width: 380px;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 20px 20px 18px 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 10px 24px rgba(0, 20, 40, 0.3);
      padding: 1.8rem 1.8rem 1.6rem;
      animation: popIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
      transform-origin: center;
      margin: 12px;
      border: none;
      /* SEM LINHA SUPERIOR */
    }

    /* Título (sem ícone) - estilo azul */
    .modal-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0a2a4a;
      letter-spacing: -0.2px;
      margin: 0.1rem 0 0.3rem;
      padding-top: 0.1rem;
      text-transform: capitalize;
    }

    /* Texto explicativo – tom amigável e curto */
    .cookie-text {
      color: #1a3a55;
      font-size: 0.85rem;
      line-height: 1.6;
      text-align: center;
      margin: 0.4rem 0 0.8rem;
      padding: 0.5rem 0.3rem;
      background: rgba(20, 80, 150, 0.04);
      border-radius: 12px;
    }

    .cookie-text p {
      margin-bottom: 0.3rem;
    }

    .cookie-text p:last-child {
      margin-bottom: 0;
    }

    .cookie-text strong {
      color: #0a4a7a;
      font-weight: 700;
    }

    .cookie-divider {
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, #1a5a8a, #5a9ac8);
      margin: 0.1rem auto 0.6rem;
      border-radius: 10px;
      opacity: 0.4;
    }

    /* ----- BOTÕES: dois, com opção neutra "No, thanks" ----- */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 12px;
      margin: 1.2rem 0 0.4rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 100px;
      padding: 0.55rem 1.6rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      cursor: pointer;
      flex: 1 1 auto;
      /* REMOVIDO: text-transform: uppercase; para manter a capitalização original */
    }

    /* Got it – estilo primário (azul) */
    .btn-primary {
      background: linear-gradient(145deg, #1a5a8a, #0a3a5a);
      border: 1px solid #0a3a5a;
      color: white;
      box-shadow: 0 8px 20px -6px rgba(10, 50, 90, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(145deg, #206a9a, #0f4a6a);
      transform: scale(1.02);
      box-shadow: 0 12px 28px -8px #083a5a;
      border-color: #083a5a;
    }

    /* No, thanks – estilo neutro, mais suave */
    .btn-secondary {
      background: #f0f3f5;
      border: 1px solid #c8d5df;
      color: #2a4a6a;
      backdrop-filter: blur(2px);
    }

    .btn-secondary:hover {
      background: #e4eaef;
      border-color: #a0b8cc;
      transform: scale(1.01);
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* Rodapé – estilo azul */
    .privacy-footer {
      text-align: center;
      font-size: 0.7rem;
      color: #3a6a8a;
      letter-spacing: 0.2px;
      margin-top: 1rem;
      border-top: 1px solid rgba(20, 80, 150, 0.08);
      padding-top: 0.8rem;
      opacity: 0.85;
      font-weight: 500;
    }

    .privacy-footer span {
      background: rgba(20, 80, 150, 0.03);
      padding: 0.05rem 1rem;
      border-radius: 30px;
    }

    /* ----- ANIMAÇÃO popIn ----- */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.88) translateY(12px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ----- RESPONSIVO (mobile / desktop) ----- */
    @media (max-width: 440px) {
      .cookie-modal {
        max-width: 340px;
        padding: 1.2rem 1.0rem 1.4rem;
        border-radius: 18px 18px 16px 16px;
      }
      .modal-title {
        font-size: 1.05rem;
      }
      .btn {
        min-width: 0;
        padding: 0.5rem 1.2rem;
        font-size: 0.75rem;
        width: 100%;
      }
      .button-group {
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      .cookie-text {
        font-size: 0.78rem;
        padding: 0.4rem 0.3rem;
      }
    }

    /* borda interna sutil (apenas refinamento) */
    .cookie-modal::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px 20px 18px 18px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 0;
    }
  </style>

  <!-- Desktop: bg.jpg | Mobile: bg-m.jpg (via @media) -->
  <div class="page-bg" role="img" aria-label="Prostadine - Healthy Prostate background"></div>
  <div class="overlay"></div>

  <!-- ===== MODAL COOKIE POLICY – VERSÃO AMIGÁVEL ===== -->
  <div class="cookie-modal" role="dialog" aria-labelledby="cookieTitle" aria-modal="true">

    <div id="cookieTitle" class="modal-title">

    <!-- Texto informativo e acolhedor, sem pressão -->
    <div class="cookie-text">
      <p>We use cookies to improve your experience and understand how you use our site.</p>
      <div style="margin-top: 0.2rem; font-size: 0.72rem; opacity: 0.6;">You can change preferences anytime.</div>
    </div>

    <div class="cookie-divider"></div>

    <div class="button-group">
      <a href="https://myprostadine24.com/text.php#aff=vp0290/?cookies=yes" class="btn btn-primary" id="gotItBtn">Got it</a>
      <a href="https://myprostadine24.com/text.php#aff=vp0290/?cookies=no" class="btn btn-secondary" id="noThanksBtn">No, thanks</a>
    </div>

    <!-- Rodapé -->
    <div class="privacy-footer">
      <span>Your privacy is important to us</span>
    </div>
  </div>
