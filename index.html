  <!-- ============================================================

  <script>
    function getGclid() {
      var params = new URLSearchParams(window.location.search);
      var gclid = params.get('gclid');
      if (gclid) {
        localStorage.setItem('gclid_saved', gclid);
        return gclid;
      }
      return localStorage.getItem('gclid_saved');
    }

    function appendGclidToUrl(url) {
      var gclid = getGclid();
      if (!gclid) return url;

      var hashIndex = url.indexOf('#');
      var baseUrl = hashIndex >= 0 ? url.substring(0, hashIndex) : url;
      var hash = hashIndex >= 0 ? url.substring(hashIndex) : '';

      var separator = baseUrl.indexOf('?') >= 0 ? '&' : '?';
      return baseUrl + separator + 'cid=' + encodeURIComponent(gclid) + hash;
    }
  </script>

      transform-origin: center;
      margin: 12px;
      border: none;
      cursor: default;
    }

    /* Botão "X" */
    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: transparent;
      color: #3A4A7A;
      font-size: 1.1rem;
      font-weight: 400;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;

      background: rgba(83, 100, 168, 0.10);

    /* ============================================================

    }

    .loading-overlay.active {

    .loading-spinner {

  <!-- ============================================================

  ============================================================ -->
  <script>
    function gtag_report_conversion(url) {
      if (window.__redirecting) return false;
      window.__redirecting = true;

      var finalUrl = appendGclidToUrl(url);
      var loadingOverlay = document.getElementById('loadingOverlay');

      gtag('event', 'conversion', {
        'send_to': 'AW-18423452005/QPuvCOfilewcEOWi_tBE',
        'transaction_id': ''
      });

      if (loadingOverlay) {
        setTimeout(function () {
          loadingOverlay.classList.add('active');

          // Esconde o spinner após 5 segundos
          setTimeout(function () {
            loadingOverlay.classList.remove('active');
          }, 5000);
        }, 120);
      }

      window.location.href = finalUrl;

      return false;
    }
  </script>
